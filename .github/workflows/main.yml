name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure
        run: cmake -G Xcode -S . -B build

      - name: Build universal Release
        run: cmake --build build --config Release

      - name: Test
        run: cd build && ctest -C Release --output-on-failure

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package-info.json'))['version'])")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package-info.json version $VERSION"
            exit 1
          fi

      - name: Assemble package
        run: |
          mkdir -p flux.artnet
          cp package-info.json flux.artnet/
          cp License.md flux.artnet/
          cp ReadMe.md flux.artnet/
          cp -R docs help externals flux.artnet/

      - name: Zip package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ZIP_NAME="flux.artnet-${GITHUB_REF_NAME}-macos-universal.zip"
          else
            ZIP_NAME="flux.artnet-manual-macos-universal.zip"
          fi
          zip -r -X "$ZIP_NAME" flux.artnet
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flux.artnet-macos-universal
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: flux.artnet ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          body: |
            Universal macOS build for Max (arm64 + x86_64).

            Unzip `flux.artnet` into `~/Documents/Max 9/Packages`.
            The package contains `externals`, `help`, `docs`, `package-info.json`, `License.md` and `ReadMe.md`.
            `externals` includes the shared `flux.artnet.core.dylib` required by both objects.
